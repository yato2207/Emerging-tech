      function getTrustScore() {
        var sum = 0;
        for (var k in state.decisionDeltas) {
          if (Object.prototype.hasOwnProperty.call(state.decisionDeltas, k)) {
            sum += state.decisionDeltas[k];
          }
        }
        return Math.max(0, Math.min(100, 50 + sum));
      }

        state.lastDelta = delta;
        state.activeEvidenceIds = evIds.slice();
        evIds.forEach(function (eid) {
          if (state.unlockedEvidenceIds.indexOf(eid) === -1) {
            state.unlockedEvidenceIds.push(eid);
          }
        });
        if (notes) state.lensNotes = notes;
        updateTopBar();
      }

            html += '<div style="border-top:1px solid var(--border);padding-top:8px;" class="stack-sm"><span style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--ink-muted);">Reference moves:</span>';
            rec.forEach(function (r) {
              html += '<div style="font-size:11px;"><strong style="color:var(--navy-imperial);">' + r.label + ':</strong> <span style="color:var(--ink-muted);">' + r.move + '</span></div>';
            });
            html += '</div>';
          }
          html += '</div>';
        });
        html += '</div>';

        // Sector tailoring
        var sec = sectors[state.sector];
        html += '<div class="sub-panel" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;">' +
          '<div><div style="font-size:12px;font-weight:700;color:var(--navy-imperial);">Sector Tailoring (' + sec.title + ': ' + sec.focus + ')</div><p style="font-size:12px;color:var(--ink-muted);margin-top:2px;">' + sec.detail + '</p></div>' +
          '<div class="segmented">' +
            '<button type="button" class="seg-btn' + (state.sector === 'government' ? ' active' : '') + '" data-sec="government">Government</button>' +
            '<button type="button" class="seg-btn' + (state.sector === 'banks' ? ' active' : '') + '" data-sec="banks">Banks</button>' +
            '<button type="button" class="seg-btn' + (state.sector === 'manufacturing' ? ' active' : '') + '" data-sec="manufacturing">Manufacturing</button>' +
          '</div></div>';

        html += '<div class="action-row">' +
          (!state.submittedPlaybook ? '<button type="button" id="submitPlaybookBtn" class="btn-primary"' + (!allPlaced ? ' disabled' : '') + '>Lock Playbook &amp; Reveal Reference Moves</button>' : '<span style="font-size:12px;font-weight:700;color:var(--emerald);">✓ Top three pre-signing priorities: free risk check, ready trust pack, and agreed breach playbook.</span>') +
        '</div></div>';

        // Dyadic Gap Matrix
        html += '<div class="grand-card stack-md"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;">' +
          '<div><h2 class="section-title">Dyadic Alignment &amp; Gap Matrix (Table 2.7)</h2><p style="font-size:12px;color:var(--ink-muted);">Select any row to compare C1 (client) and V1 (vendor) views side by side.</p></div>' +
          '<button type="button" id="toggleAllMatrixBtn" class="btn-link" style="color:var(--navy-imperial);">' + (state.revealedMatrixRows.length === DYADIC_MATRIX.length ? 'Collapse all rows' : 'Reveal all 9 rows') + '</button></div>' +
          '<div class="matrix-list">';

        DYADIC_MATRIX.forEach(function (m) {
          var isOpen = state.revealedMatrixRows.indexOf(m.row) !== -1;
          var stClass = m.status === 'Aligned' ? 'badge-direct' : m.status === 'Gap' ? 'badge-inferred' : 'badge-open';
          var stStyle = m.status === 'Aligned' ? 'background:var(--emerald-bg);color:var(--emerald);border-color:var(--emerald-border);' : m.status === 'Gap' ? 'background:var(--rose-bg);color:var(--rose);border-color:var(--rose-border);' : '';
          html += '<div class="matrix-row"><button type="button" class="matrix-trigger" aria-expanded="' + isOpen + '" data-mrow="' + m.row.replace(/"/g, '&quot;') + '">' +
            '<span style="display:flex;align-items:center;gap:10px;"><strong style="font-size:13px;">' + m.row + '</strong><span class="badge ' + stClass + '" style="' + stStyle + '">' + m.status + '</span></span>' +
            '<span style="color:var(--ink-muted);font-size:12px;">' + (isOpen ? '▲' : '▼') + '</span></button>';
          if (isOpen) {
            html += '<div class="matrix-detail">' +
              '<div class="grand-card" style="padding:12px;"><strong style="color:var(--navy-imperial);display:block;margin-bottom:4px;">Client (C1)</strong><p style="color:#334155;">' + m.c1 + '</p></div>' +
              '<div class="grand-card" style="padding:12px;"><strong style="color:var(--navy-imperial);display:block;margin-bottom:4px;">Vendor (V1)</strong><p style="color:#334155;">' + m.v1 + '</p></div>' +
              '<div class="callout-gold" style="padding:12px;"><strong style="color:var(--amber);display:block;margin-bottom:4px;">Playbook Takeaway</strong><p>' + m.takeaway + '</p></div>' +
            '</div>';
          }
          html += '</div>';
        });
        html += '</div></div>';

        html += '<div style="display:flex;justify-content:flex-end;"><button type="button" id="toVerdictBtn" class="btn-primary">View Final Verdict →</button></div></section>';
        main.innerHTML = html;

        var rp = document.getElementById('resetPlaybookBtn');
        if (rp) rp.addEventListener('click', function () { state.rolePlacements = {}; state.selectedRole = null; state.submittedPlaybook = false; render(); });
        main.querySelectorAll('[data-role]').forEach(function (b) {
          var id = b.getAttribute('data-role');
          b.addEventListener('click', function () { state.selectedRole = state.selectedRole === id ? null : id; render(); });
          b.addEventListener('dragstart', function () { state.dragRole = id; });
        });
        main.querySelectorAll('[data-stage]').forEach(function (sEl) {
          var sid = sEl.getAttribute('data-stage');
          sEl.addEventListener('dragover', function (e) { if (!state.submittedPlaybook) e.preventDefault(); });
          sEl.addEventListener('drop', function (e) { e.preventDefault(); if (!state.submittedPlaybook && state.dragRole) { state.rolePlacements[state.dragRole] = sid; state.dragRole = null; state.selectedRole = null; render(); } });
          sEl.addEventListener('click', function () { if (!state.submittedPlaybook && state.selectedRole) { state.rolePlacements[state.selectedRole] = sid; state.selectedRole = null; render(); } });
          sEl.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && !state.submittedPlaybook && state.selectedRole) { e.preventDefault(); state.rolePlacements[state.selectedRole] = sid; state.selectedRole = null; render(); } });
        });
        main.querySelectorAll('[data-removerole]').forEach(function (b) {
          b.addEventListener('click', function (e) { e.stopPropagation(); if (!state.submittedPlaybook) { var id = b.getAttribute('data-removerole'); delete state.rolePlacements[id]; state.selectedRole = id; render(); } });
        });
        main.querySelectorAll('[data-sec]').forEach(function (b) {
          b.addEventListener('click', function () { state.sector = b.getAttribute('data-sec'); render(); });
        });
        var sp = document.getElementById('submitPlaybookBtn');
        if (sp) sp.addEventListener('click', function () {
          state.submittedPlaybook = true;
          var im = PLAYBOOK_ROLES.filter(function (r) { return state.rolePlacements[r.id] && r.ideal.indexOf(state.rolePlacements[r.id]) !== -1; }).length;
          recordDecision('act3-playbook', im >= 4 ? 10 : im >= 2 ? 5 : 0, ['c1-evidence', 'v1-usability', 'v1-conservative'], ACT3_DEFAULT_LENS);
          render();
        });
        document.getElementById('toggleAllMatrixBtn').addEventListener('click', function () {
          state.revealedMatrixRows = state.revealedMatrixRows.length === DYADIC_MATRIX.length ? [] : DYADIC_MATRIX.map(function (m) { return m.row; });
          render();
        });
        main.querySelectorAll('[data-mrow]').forEach(function (b) {
          b.addEventListener('click', function () {
            var r = b.getAttribute('data-mrow');
            var idx = state.revealedMatrixRows.indexOf(r);
            if (idx === -1) state.revealedMatrixRows.push(r); else state.revealedMatrixRows.splice(idx, 1);
            render();
          });
        });
        document.getElementById('toVerdictBtn').addEventListener('click', function () {
          recordDecision('act3-complete', 0, ['c1-evidence', 'c1-education', 'c1-response'], ACT3_DEFAULT_LENS);
          navigate('verdict');
        });
      }

      /* ======================== VERDICT ======================== */
      function renderVerdict(main) {
        var score = getTrustScore();
        var verdict = score >= 75
          ? { title: 'Warranted Trust Built — Verification Made Cheap', summary: 'You gated LLM scaling on testability and measured ROI, prioritized verifiable audit/POC evidence over logos, educated on remaining risk, and codified breach candour and exit clauses.' }
          : score >= 50
          ? { title: 'Conditional Trust — Safeguards Present, Gaps Remain', summary: 'You balanced parts of the desk well, yet left either post-sale verification costs, hidden token/offloading risks, or dyadic signal gaps partially exposed.' }
          : { title: 'Fragile Assurance — Unverified Claims & Hidden Risk', summary: 'Promises, hype, or delayed disclosure eroded confidence. As both cases show, buyers commit only when they receive evidence they can check themselves.' };

        main.innerHTML =
          '<section class="container-narrow stack-lg">' +
            '<div class="grand-navy hero-box stack-md">' +
              '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid rgba(217,162,27,0.28);padding-bottom:20px;">' +
                '<div><p class="kicker">Final Simulation Verdict</p><h1 class="hero-title" style="font-size:clamp(1.5rem,3vw,2.2rem);">' + verdict.title + '</h1></div>' +
                '<div style="background:rgba(11,25,48,0.65);border:1px solid rgba(217,162,27,0.45);border-radius:12px;padding:12px 20px;text-align:right;">' +
                  '<div style="font-size:11px;color:var(--gold-bright);">Warranted Trust</div>' +
                  '<div class="mono" style="font-size:28px;font-weight:700;">' + score + '<span style="font-size:14px;opacity:0.6;">/100</span></div>' +
                '</div>' +
              '</div>' +
              '<p style="font-size:15px;color:rgba(255,255,255,0.9);">' + verdict.summary + '</p>' +
              '<blockquote style="margin:0;background:rgba(255,255,255,0.08);border:1px solid rgba(217,162,27,0.35);border-radius:12px;padding:18px;">' +
                '<p class="hero-quote" style="font-size:1.05rem;">&ldquo;For a manager working with emerging technology, the scarce resource is not capability. It is warranted trust, and it is built by whoever makes verification cheap.&rdquo;</p>' +
              '</blockquote>' +
            '</div>' +

            '<div class="grid-3">' +
              '<div class="grand-card stack-sm"><div class="mono" style="font-size:12px;font-weight:700;color:var(--gold-burnished);">Takeaway 01</div><h2 class="section-title">Trust follows verifiable evidence, not assurance</h2><p style="font-size:12px;color:var(--ink-muted);">Certifications, audit summaries, 60–90 day pilots, and POCs beat vendor logos and plain reassurance.</p></div>' +
              '<div class="grand-card stack-sm"><div class="mono" style="font-size:12px;font-weight:700;color:var(--gold-burnished);">Takeaway 02</div><h2 class="section-title">The sharpest risk sits after the sale</h2><p style="font-size:12px;color:var(--ink-muted);">Runaway token bills and offloaded thinking in LLM rollouts; unprotected sensitive files leaving the perimeter after deployment.</p></div>' +
              '<div class="grand-card stack-sm"><div class="mono" style="font-size:12px;font-weight:700;color:var(--gold-burnished);">Takeaway 03</div><h2 class="section-title">The manager&apos;s job is to make verification cheap</h2><p style="font-size:12px;color:var(--ink-muted);">Pair contracts with client-visible dashboards, risk checks on real data, and pre-agreed breach playbooks.</p></div>' +
            '</div>' +

            '<div class="stamp-box stack-sm">' +
              '<h3 style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--amber);">Study Limitations Stamp</h3>' +
              '<ul style="margin:0;padding-left:18px;font-size:12px;color:#334155;" class="grid-2">' +
                '<li>One respondent per case (qualitative exploratory design).</li>' +
                '<li>Case 2 is a conceptual dyad drawn from two different firms.</li>' +
                '<li>Figures such as 31–32%, $6–10 million, and the refinery statistics (99% / 8% / 40%) are self-reported and unverified.</li>' +
                '<li>Question 7 (Indian LLMs) was not asked in the interview, so related insights are marked <strong>Inferred</strong>.</li>' +
              '</ul>' +
            '</div>' +

            '<div class="grand-card" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;">' +
              '<p style="font-size:12px;font-weight:500;color:var(--ink-muted);">Group 1, Section B, Emerging Technologies for Digital Transformation, DMS IIT Delhi, November 2026.</p>' +
              '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
                '<button type="button" id="verdictTeamBtn" class="btn-outline">View Team Page</button>' +
                '<button type="button" id="restartBtn" class="btn-primary">Restart Simulation</button>' +
              '</div>' +
            '</div>' +
          '</section>';

        document.getElementById('verdictTeamBtn').addEventListener('click', function () { navigate('team'); });
        document.getElementById('restartBtn').addEventListener('click', resetAll);
      }

      /* ======================== TEAM PAGE ======================== */
      function renderTeam(main) {
        var html = '<section class="container-narrow stack-lg">' +
          '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;">' +
            '<button type="button" id="teamBackBtn" class="btn-outline">← Back to Simulation</button>' +
            '<span style="font-size:12px;color:var(--ink-muted);">Emerging Technologies for Digital Transformation · DMS, IIT Delhi</span>' +
          '</div>' +

          '<div class="grand-navy" style="overflow:hidden;">' +
            '<div style="padding:28px 32px;border-bottom:1px solid rgba(217,162,27,0.28);" class="stack-sm">' +
              '<p class="kicker">Department of Management Studies · IIT Delhi · MBA Section B · Group 1 · November 2026</p>' +
              '<h1 class="hero-title" style="font-size:clamp(1.6rem,3.2vw,2.3rem);">Research Team &amp; Study Protocol</h1>' +
              '<p style="font-size:14px;color:rgba(255,255,255,0.86);max-width:720px;">This interactive simulation translates our qualitative end-term study <strong style="color:#fff;">&ldquo;Enterprise LLM Adoption and B2B Trust in Cybersecurity&rdquo;</strong> into an executive decision desk.</p>' +
            '</div>' +
            '<div style="padding:16px 32px;background:rgba(11,25,48,0.55);font-size:12px;color:rgba(255,255,255,0.82);" class="grid-3">' +
              '<div><strong style="color:var(--gold-bright);display:block;margin-bottom:2px;">Fieldwork</strong>3 online semi-structured interviews (Nov 11–13, 2026)</div>' +
              '<div><strong style="color:var(--gold-bright);display:block;margin-bottom:2px;">Analytical Method</strong>Braun &amp; Clarke (2006) 6-step coding; matched-role dyad in Case 2</div>' +
              '<div><strong style="color:var(--gold-bright);display:block;margin-bottom:2px;">Anonymity Protocol</strong>Case 1 CTO of an AI-native firm; Case 2 strictly C1 and V1</div>' +
            '</div>' +
          '</div>' +

          '<div class="stack-md">' +
            '<div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--border);padding-bottom:10px;">' +
              '<h2 class="section-title" style="font-size:1.35rem;">Group 1 Authors</h2>' +
              '<span style="font-size:12px;color:var(--ink-muted);">7 Researchers · DMS, IIT Delhi</span>' +
            '</div>' +
            '<div class="grid-3">';

        TEAM.forEach(function (m) {
          html += '<article class="member-card">' +
            '<div class="portrait-ring">' +
              '<img src="' + m.photo + '" alt="Portrait of ' + m.name + '" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';" />' +
              '<div class="portrait-fallback" style="display:none;">' + m.initials + '</div>' +
            '</div>' +
            '<div><h3 style="font-size:14px;font-weight:700;color:var(--navy-imperial);line-height:1.3;">' + m.name + '</h3>' +
              '<p class="mono" style="font-size:12px;font-weight:600;color:var(--gold-burnished);margin-top:2px;">' + m.roll + '</p>' +
              '<p style="font-size:12px;color:var(--ink-muted);margin-top:3px;">' + m.role + '</p></div>' +
          '</article>';
        });

        html += '</div></div></section>';
        main.innerHTML = html;

        document.getElementById('teamBackBtn').addEventListener('click', function () {
          navigate(state.prevScreen === 'team' ? 'intro' : state.prevScreen);
        });
      }

      /* ======================== RENDER ROOT & EVENTS ======================== */
      function render() {
        updateTopBar();
        var main = document.getElementById('appMain');
        if (state.screen === 'intro') renderIntro(main);
        else if (state.screen === 'act1') renderAct1(main);
        else if (state.screen === 'act2') renderAct2(main);
        else if (state.screen === 'act3') renderAct3(main);
        else if (state.screen === 'verdict') renderVerdict(main);
        else if (state.screen === 'team') renderTeam(main);
        renderDrawer();
      }

      document.getElementById('brandBtn').addEventListener('click', function () { navigate('intro'); });
      document.getElementById('navTeamBtn').addEventListener('click', function () { navigate('team'); });
      document.getElementById('footerTeamBtn').addEventListener('click', function () { navigate('team'); });
      document.getElementById('openDrawerBtn').addEventListener('click', function () { state.drawerOpen = true; renderDrawer(); });
      document.getElementById('footerEvidenceBtn').addEventListener('click', function () { state.drawerOpen = true; renderDrawer(); });
      document.getElementById('closeDrawerBtn').addEventListener('click', function () { state.drawerOpen = false; renderDrawer(); });
      document.getElementById('drawerBackdrop').addEventListener('click', function () { state.drawerOpen = false; renderDrawer(); });
      document.getElementById('drawerTabMoment').addEventListener('click', function () { state.drawerTab = 'moment'; renderDrawer(); });
      document.getElementById('drawerTabCodebook').addEventListener('click', function () { state.drawerTab = 'codebook'; renderDrawer(); });

      window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && state.drawerOpen) {
          state.drawerOpen = false;
          renderDrawer();
        }
      });

      render();
    })();
  </script>
</body>
</html>
